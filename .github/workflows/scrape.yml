name: Scrape Events

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9am UTC (festivals only run on 1st of month via code logic)
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python3 -m playwright install chromium

      - name: Run GigRadar (group ${{ matrix.group }})
        id: scrape
        continue-on-error: true
        run: python3 main.py --group ${{ matrix.group }}
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}

      - name: Upload group events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-group-${{ matrix.group }}
          path: artifacts/events_group_${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload scraper errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-errors-group-${{ matrix.group }}
          path: artifacts/scraper_errors.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Report scraper failure
        if: steps.scrape.outcome == 'failure'
        run: exit 1

  merge:
    runs-on: ubuntu-latest
    needs: scrape
    if: always()
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Download group 1 events
        uses: actions/download-artifact@v4
        with:
          name: events-group-1
          path: artifacts/

      - name: Download group 2 events
        uses: actions/download-artifact@v4
        with:
          name: events-group-2
          path: artifacts/

      - name: Merge group results
        run: python3 main.py --merge

      - name: Commit data changes
        run: |
          git config user.name "Andrei-Mihai Nicolae"
          git config user.email "andrei@nicolaeandrei.com"
          git add web/public/data/events.json
          git diff --staged --quiet || git commit -m "Update event data $(date +%Y-%m-%d)"
          git push

      - name: Download all scraper errors
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: scraper-errors-*
          path: all-errors/
        continue-on-error: true

      - name: Combine scraper failures
        id: combine_errors
        if: always()
        run: |
          ERROR_COUNT=$(python3 scripts/merge_scraper_errors.py \
            --input-dir all-errors \
            --output artifacts/scraper_errors.json)
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "has_errors=true" >> $GITHUB_OUTPUT
          else
            echo "has_errors=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload combined scraper failures
        if: always() && steps.combine_errors.outputs.has_errors == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scraper-errors
          path: artifacts/scraper_errors.json
          if-no-files-found: error
          retention-days: 7

      - name: Trigger fix-scrapers workflow
        if: always() && steps.combine_errors.outputs.has_errors == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'fix-scrapers',
              client_payload: {
                run_id: context.runId
              }
            })
