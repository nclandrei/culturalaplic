name: Fix Scrapers

on:
  repository_dispatch:
    types: [fix-scrapers]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the scrape workflow containing scraper-errors'
        required: true
        type: string
      dry_run:
        description: 'Dry run - do not create PR'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python3 -m playwright install chromium

      - name: Download scraper errors artifact
        if: github.event.client_payload.run_id || inputs.run_id
        uses: actions/download-artifact@v4
        with:
          name: scraper-errors
          path: artifacts
          run-id: ${{ github.event.client_payload.run_id || inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate scraper errors artifact
        run: |
          test -s artifacts/scraper_errors.json
          cat artifacts/scraper_errors.json

      - name: Install Amp CLI
        run: npm install -g @ampcode/cli

      - name: Run Amp to fix scrapers
        env:
          AMP_API_KEY: ${{ secrets.AMP_API_KEY }}
          AMP_SETTINGS_FILE: ${{ runner.temp }}/amp-settings.json
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          printf '%s\n' '{"amp.dangerouslyAllowAll": true}' > "$AMP_SETTINGS_FILE"
          ERRORS_JSON=$(python3 -c "import json; d=json.load(open('artifacts/scraper_errors.json')); print(json.dumps(d['errors'], ensure_ascii=False))")
          ERROR_COUNT=$(python3 -c "import json; d=json.load(open('artifacts/scraper_errors.json')); print(len(d['errors']))")

          echo "Fixing $ERROR_COUNT scraper(s)"
          
          # Create the prompt for Amp
          PROMPT="You are fixing broken scrapers for the Cultură la plic event aggregator.

          Fix every scraper listed below. Each object contains the scraper name,
          category, failure message, and official events URL:

          $ERRORS_JSON

          INSTRUCTIONS:
          1. First, load the generating-scrapers skill using the skill tool
          2. For each failure, read scrapers/<category>/<scraper_name>.py
          3. Create tmp/ directory if needed: mkdir -p tmp
          
          4. VISUAL INSPECTION (repeat for each failed source as needed):
             Take a screenshot and inspect the page structure using Playwright:
             python3 -c \"
             from playwright.sync_api import sync_playwright
             with sync_playwright() as p:
                 browser = p.chromium.launch()
                 page = browser.new_page()
                 page.goto('EVENTS_URL_FROM_THE_FAILURE')
                 page.wait_for_timeout(3000)
                 page.screenshot(path='tmp/page_screenshot.png', full_page=True)
                 # Get accessibility tree for structure
                 snapshot = page.accessibility.snapshot()
                 print('Page title:', page.title())
                 print('Accessibility tree:', snapshot)
                 browser.close()
             \"
             Then use the look_at tool to examine tmp/page_screenshot.png and understand the visual layout.
          
          5. Get the raw HTML to find correct selectors:
             python3 -c \"
             from playwright.sync_api import sync_playwright
             with sync_playwright() as p:
                 browser = p.chromium.launch()
                 page = browser.new_page()
                 page.goto('EVENTS_URL_FROM_THE_FAILURE')
                 page.wait_for_timeout(3000)
                 print(page.content())
                 browser.close()
             \" > tmp/page_content.html
             Then read tmp/page_content.html to find the correct CSS selectors.
          
          6. Fix every failed scraper based on what you found
          
          7. Test each fixed scraper module, then run:
             python3 -m pytest tests/
          
          8. ITERATE: If 0 events returned:
             - Take another screenshot to see current page state
             - Check if page needs JS rendering (needs_js=True)
             - Check if selectors need adjustment
             - Fix and test again
             - Repeat until events are returned
          
          9. Once every listed scraper is working, confirm the fixes are complete

          Do NOT commit any changes. Just fix the code and verify it works."

          # Amp may print an account error while exiting 0, so inspect both
          # its process status and output before treating the run as healthy.
          set +e
          echo "$PROMPT" | amp --execute 2>&1 | tee "$RUNNER_TEMP/amp-output.log"
          AMP_STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$AMP_STATUS" -ne 0 ]; then
            exit "$AMP_STATUS"
          fi

          if grep -qi "Error: Out of Credits" "$RUNNER_TEMP/amp-output.log"; then
            echo "::warning::Amp is out of credits"
            if [ "$DRY_RUN" != "true" ]; then
              exit 1
            fi
          fi

      - name: Create fix branch and PR
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERROR_COUNT=$(python3 -c "import json; d=json.load(open('artifacts/scraper_errors.json')); print(len(d['errors']))")
          ERROR_LIST=$(python3 -c "import json; d=json.load(open('artifacts/scraper_errors.json')); print('\\n'.join('- **' + e['scraper_name'] + '** (' + (e.get('category') or 'unknown') + ')' for e in d['errors']))")
          BRANCH_NAME="bot/fix-$ERROR_COUNT-scrapers-$(date +%Y%m%d)-${{ github.run_id }}"
          
          # Configure git
          git config user.name "Andrei-Mihai Nicolae"
          git config user.email "andrei@nicolaeandrei.com"
          
          # Create branch and commit
          git checkout -b "$BRANCH_NAME"
          git add scrapers/ services/enrichment.py services/http.py tests/
          if git diff --staged --quiet; then
            echo "No scraper changes were staged"
            exit 0
          fi
          git commit -m "Fix $ERROR_COUNT scraper(s) (auto-generated)"
          git push -u origin "$BRANCH_NAME"
          
          # Create PR
          gh pr create \
            --title "Fix $ERROR_COUNT scraper(s) (auto-generated)" \
            --body "This PR was automatically generated by the fix-scrapers workflow.

          $ERROR_LIST

          Please review the changes carefully before merging.

          ---
          *Generated by fix-scrapers workflow*" \
            --label "auto-fix"
